# Gemma 4 Developer Agent submission configuration.
# The competition harness provides the model and sandbox tools.
name: deeppanda_coding_agent
agent_class: LlmAgent
model: gemma-4-31b-it-qat-w4a16-ct
description: >-
  A focused repository-repair agent that finds the controlling code path,
  applies a minimal fix, validates it, and submits a patch for every task.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
  - agent_tool:
      config_path: sub_agents/test_reviewer.yaml
      skip_summarization: true
skills:
  - skills/repo_navigation
generate_content_config: !include configs/sampling.yaml
